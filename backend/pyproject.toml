[project]
name = "verity-backend"
version = "0.1.0"
description = "Math homework assessment and feedback API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.25,<2", "python-multipart>=0.0.20,<1", "openai>=2,<3",
  "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3", "boto3>=1.35,<2", "sympy>=1.13,<2"
]
[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "reportlab>=5.0.1",
    "ruff>=0.11,<1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["verity"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
