# API and worker backed by Supabase Postgres and private Storage from ../.env.
x-backend: &backend
  build: .
  env_file: ../.env
  environment:
    STORAGE_DIR: /app/data/documents
  volumes:
    - documents:/app/data

services:
  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *backend
    command: ["python", "-m", "verity.jobs"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  documents:
